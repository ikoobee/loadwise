<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LoadWise 装柜仿真</title>
  <script type="module" src="/src/main.ts"></script>
</head>
<body>
  <header>
    <div class="logo">柜</div>
    <div class="title">LoadWise 装柜仿真 <span class="badge">Community v0.1</span></div>
    <div class="spacer"></div>
    <button class="icon-btn" id="themeBtn">深浅切换</button>
  </header>

  <main>
    <!-- ============ 左栏：输入 ============ -->
    <section class="panel">
      <div class="panel-scroll">
        <div class="section-title">柜型与参数</div>
        <div class="row">
          <div class="field" style="flex:2">
            <label>柜型</label>
            <select id="containerSel"></select>
          </div>
        </div>
        <div class="row" id="customDims" style="display:none">
          <div class="field"><label>内长 cm</label><input type="number" id="cL" value="1203"></div>
          <div class="field"><label>内宽 cm</label><input type="number" id="cW" value="235"></div>
          <div class="field"><label>内高 cm</label><input type="number" id="cH" value="239"></div>
          <div class="field"><label>限重 kg</label><input type="number" id="cM" value="26700"></div>
        </div>
        <div class="row">
          <div class="field"><label>箱间间隙 cm</label><input type="number" id="clearance" value="1" min="0" step="0.5"></div>
          <div class="field" style="justify-content:flex-end"><label>&nbsp;</label>
            <button class="btn-ghost" id="loadDemo">载入示例</button></div>
        </div>
        <div class="hint" id="containerInfo"></div>

        <div class="divider"></div>
        <div class="section-title">货物清单</div>
        <table class="items">
          <thead><tr>
            <th>名称</th><th>长</th><th>宽</th><th>高</th><th>重</th><th>数量</th><th>可叠</th><th>旋转</th><th></th>
          </tr></thead>
          <tbody id="itemsBody"></tbody>
        </table>
        <div class="row" style="margin-top:8px">
          <button class="btn-ghost" id="addItem">＋ 添加货物</button>
        </div>
        <div class="divider"></div>
        <button class="btn" id="runBtn">开始装载</button>
        <div class="hint" style="margin-top:8px" id="unplacedInfo"></div>
      </div>
    </section>

    <!-- ============ 中栏：3D 视口 ============ -->
    <section class="panel">
      <div class="viewport-wrap">
        <div id="three"></div>
        <div class="view-btns">
          <button class="icon-btn" data-view="iso">等轴</button>
          <button class="icon-btn" data-view="door">门视</button>
          <button class="icon-btn" data-view="side">侧视</button>
          <button class="icon-btn" data-view="top">俯视</button>
        </div>
        <div class="legend" id="legend"></div>
        <div class="viewport-bar">
          <button class="icon-btn" id="playBtn">▶ 播放</button>
          <span class="step-label" id="stepLabel">步骤 0 / 0</span>
          <input type="range" id="stepSlider" min="0" max="0" value="0">
        </div>
      </div>
    </section>

    <!-- ============ 右栏：统计 / 步骤 / 指导书 ============ -->
    <section class="panel">
      <div class="panel-scroll">
        <div class="section-title">装载统计</div>
        <div class="kpi-grid">
          <div class="tile"><div class="label">体积利用率</div><div class="value" id="kpiUtil">–</div></div>
          <div class="tile"><div class="label">装载件数</div><div class="value" id="kpiLoaded">–</div><div class="sub" id="kpiLoadedSub"></div></div>
          <div class="tile"><div class="label">总重</div><div class="value" id="kpiWeight">–</div></div>
          <div class="tile"><div class="label">重心偏移</div><div class="value" id="kpiCog">–</div><div class="sub" id="kpiCogSub">前/后 · 左/右</div></div>
        </div>
        <div class="meter-block">
          <div class="meter-head"><span>载重占比</span><span id="meterText">–</span></div>
          <div class="meter"><div class="meter-fill" id="meterFill"></div></div>
        </div>
        <div class="hint" id="warnings"></div>

        <div class="section-title" style="margin-top:14px">装载序列（点击定位步骤）</div>
        <div class="steps" id="stepsList"></div>

        <div class="section-title" style="margin-top:14px">装载指导书 · 主视图</div>
        <div class="guide-canvas-wrap"><canvas class="guide" id="guideCanvas" width="640" height="300"></canvas></div>
      </div>
    </section>
  </main>

  <div id="toast"></div>
</body>
</html>
